; ---------------------------------------------------------------------------
; BountiesExpansion.ini
; 放在 RDR2 目录下的 BountiesExpansion\ 文件夹里（与 Lang.dat 同级）。
; 这个文件是可选的：缺省值都写在内置代码里，这里只用来覆盖。
; ---------------------------------------------------------------------------

[General]
; 0 = 不写日志（发布默认）；1 = 写 BountiesExpansion.log，用于反馈问题。
Debug=0

[Lang]
; 语言包文件名，必须放在本目录（BountiesExpansion\）下。
; 换一套翻译只改这一行，例如：File=Lang_en.dat
File=Lang.dat

[Poster]
; ---------------------------------------------------------------
; 海报、拦截者与交付相关
; ---------------------------------------------------------------

; 1 = 创建状态机前先进入 flowblock（1.4.4 这么做）。本 build 上会让
;     UI_STATE_MACHINE_CREATE 返回 0，于是退回英文印刷纸。默认 0。
Enter=1
; 1 = 自己调用 _PEDSHOT_GENERATE_PERSONA_PHOTO 生成头像纹理
;     （目标字典 MINIGAME_PROFILE_PHOTO，1.4.4 的做法）。默认 0，先不启用。
GeneratePedshot=1
; 贴图来源：0=不写 tex/txd（让 flowblock 自己决定）；1=网络层 pedshot 名；
; 2=游戏自带 bounty_posters / ped_picture。默认 2。
Portrait=6
; 1 = 纸张实体额外转 180 度（UI 会印在模型正面，默认朝向是背对玩家）
FlipHeading=1
; 卷宗面板头像的纵向拉伸（百分比）。数值越大照片越高。
; 上下被压扁就加大，比如 118 → 130；拉过头了就减小。
PanelPortraitScale=140
; 卷宗面板头像开关。1=贴照片，0=退回剪影占位（若面板导致卡顿可设 0 排查）。
PanelPortrait=1
; 接海报后是否生成"竞争者"骑手（25% 概率）。该功能会让脚本卡死，先关。
; 要排查时改成 1，日志会逐步记录到哪一步停住。
Rivals=1
; 出现概率（0-100）。上面 Rivals 只是总开关，实际掷骰用这里的值。
RivalsChance=100
; 猎人是否骑马出现。1 = 骑马，0 = 步行。
; 当前 build 上骑乘的 ped 只会喊话不动手，建议先用 0。
HuntersOnHorse=1
; 拦截者的 ped 模型。默认 G_M_M_UniRanchers_01（已实测可战斗）。
; 注意：G_M_M_BountyHunters_01 在加载徽章类 mod 时无法进入战斗，会只喊不打。
; 骑马 6 秒追不上就强制下马（0 = 不下马，保持骑马追击）。
HuntersDismountIfStuck=0
HunterModel=G_M_M_UniRanchers_01
; 押送途中出现的追兵：抓到人、离出发点 250m 以上时触发。
; 1 = 开启；0 = 关闭。
CustodyRivals=1
; 押送途中出现追兵的概率（百分比，每单独立掷一次）。0 = 永不出现，
; 100 = 必定出现（测试用）。默认 25。
CustodyChance=100
; 【旧纸质方案，通常不用动】FaceOnPaper=1 时由脚本把中文直接画在告示纸上，
; 原生 UI 正常工作时保持 0 即可。
FaceOnPaper=0

; 以下 Face* 只在 FaceOnPaper=1 时参与，平时改它们没有效果。

; 以下是叠字的位置，单位是纸高的千分之一：0 = 纸上边缘，1000 = 纸下边缘。
; 原版英文印在固定位置，想盖准就微调这几个数（改完不用重编，约 2 秒后生效）。
FaceTitleY=45
FaceNameY=545
FaceRewardY=640
FaceCondY=730
FaceHintY=850
; 所有行整体上下平移，正值向下
FaceShiftY=0
; 字号百分比，100 = 100%
FaceScalePct=100

[UI]
; 任务中查看通缉令的快捷键，Windows 虚拟键码，118 = F7
ReviewKey=118

; 目标头顶的红色「通缉 名字 距离」标记。1=显示，0=关闭。
; 近距离 22m 内出现，追捕阶段 45m 内出现；活捉绑好后自动隐藏。
TargetMarker=1

; 标记的锚点：0 = 从人物脚下按 TargetMarkerHeight 抬升（默认，和最初那版一样）；
; 55120 = 头部骨骼（想让标记跟着高矮/骑马一起动的可以试，不填就保持 0）。
TargetMarkerBone=0
; 锚点之上抬升的高度，单位厘米。默认 115 就是原来看起来"在头顶"的效果；
; 觉得高就减到 90~100，觉得压到头就加到 130。
TargetMarkerHeight=115
; 屏幕纵向微调，千分比：负数上移、正数下移（-20 = 上移 2% 屏高）。
TargetMarkerOffsetY=0
; 字号百分比：30 = 原大小，20 = 更小更贴身。
TargetMarkerScale=30

[Portraits]
; 备用池：只有模型名没在下面的 [PortraitModel] 里登记时，才按罪名关键字归类取这里。
; 值可以写多张（逗号分隔），同类里的不同任务会自动分到不同脸。
violent_white_30 = portrait_9, portrait_10
violent_white_50 = portrait_7
bandit_30        = portrait_15, portrait_16
white_collar_30  = portrait_17
latino_30        = portrait_5, portrait_6
native_30        = portrait_3
native_50        = portrait_4
default          = portrait_1, portrait_2, portrait_3, portrait_4, portrait_9, portrait_10

[PortraitModel]
; ★ 最精确的一层：按「通缉犯的模型文件」分配头像。
;   键 = ped 模型名（OpenIV 里搜索用的那个名字，小写），值 = portrait_<编号>，可写多张；
;   同一个模型被多个任务使用时，写两张就会按任务 id 稳定分给不同的人（读档不变）。
g_m_m_uniranchers_01        = portrait_1, portrait_2
g_m_m_unimountainmen_01     = portrait_3, portrait_4
g_m_m_unibanditos_01        = portrait_5, portrait_6
g_m_o_uniexconfeds_01       = portrait_7, portrait_8
g_m_m_unicriminals_02       = portrait_9, portrait_10
g_m_m_unicriminals_01       = portrait_11, portrait_12
g_m_m_unimicahgoons_01      = portrait_13, portrait_14
g_m_m_uniduster_01          = portrait_15
g_m_m_uniduster_02          = portrait_16
a_m_m_grifancytravellers_01 = portrait_17
a_m_m_sdfancytravellers_01  = portrait_18
a_f_m_lowersdtownfolk_01    = portrait_19
a_m_o_sdupperclass_01       = portrait_20
g_m_m_unibrontegoons_01     = portrait_21

[PortraitMap]
; 单点覆盖：键 = 任务 id，值 = 一个具体编号。一般用不到，
; 只有想把某个任务临时钉到某张脸时才写，例如 13 = portrait_18。
; 这一层优先级最高，会盖掉上面的 [PortraitModel]。

[Reward]
; 全局金额倍率，100 = 原价，200 = 双倍
RewardScale=300
; 活捉任务（要求“活捉”）：活着交付的比例
CapturedAlivePercent=100
; 活捉任务：打死后还能按这个百分比结算（0 = 直接判失败，原版行为）。
; 你本地一直用 5，发布沿用 5；想严格原版就改 0。
RequiredAliveKilledPercent=5

; 死活不论任务（要求“死活不论”）：活着交付 120%，交尸体 100%
DeadOrAliveAlivePercent=120
DeadOrAliveKilledPercent=100
